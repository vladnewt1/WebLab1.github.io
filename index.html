<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета користувача</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h1>Анкета</h1>
    <form id="surveyForm">
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Вік:</label>
        <input type="number" id="age" name="age" required>

        <label for="height">Ріст (см):</label>
        <input type="number" id="height" name="height" required>

        <label for="height">Вага:</label>
        <input type="number" id="vaga" name="vaga" required>

        <label for="city">Місто:</label>
        <input type="text" id="city" name="city" required>

        <label for="isStudent">Студент:</label>
        <select id="isStudent" name="isStudent">
            <option value="Так">Так</option>
            <option value="Ні">Ні</option>
        </select>

        <label for="photo">Завантажте фото:</label>
        <input type="file" id="photo" accept="image/*" required>

        <button type="submit">Відправити</button>
    </form>

    <div class="result" id="result" style="display: none;">
        <h2>Результати анкети:</h2>
        <p id="resultText"></p>
        <img id="resultImage" src="" alt="Фото користувача">
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
